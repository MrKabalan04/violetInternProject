services:
  mysql:
    image: mysql:8.4
    container_name: violet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootdevpass
      MYSQL_DATABASE: violet_intern
      MYSQL_USER: violet
      MYSQL_PASSWORD: violetdevpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-prootdevpass",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
